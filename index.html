<title>Splitlab Experiment Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: fixed left rail of sections + one working column; collapses to a top bar under 860px */
:root{
  --bg:#f8fafb; --surface:#ffffff; --surface-2:#f0f3f6; --ink:#1c2430; --ink-2:#4d5967; --muted:#7a8594; --line:#e3e8ed;
  --accent:#14867a; --accent-ink:#ffffff; --accent-soft:#e3f4f1;
  --ctrl:#7a8594; --trt:#14867a; color-scheme:light;
  --good:#1d7a3e; --good-soft:#dff2e5; --bad:#b4271b; --bad-soft:#fbe4e1; --flat:#8f6400; --flat-soft:#f8eccc; --info:#2453c4; --info-soft:#e2e9fb;
  --pin:#d9480f;
  --shadow:0 1px 2px rgba(20,26,33,.06),0 4px 16px rgba(20,26,33,.06);
  --f-display:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:26px;font-weight:700}
h2{font-size:18px;font-weight:700}
h3{font-size:15px;font-weight:600}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:12.5px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:0 6px}
.brand svg{flex:none}
.brand b{font-family:var(--f-display);font-size:18px;font-weight:800;letter-spacing:-.02em}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;margin-top:-2px}
.navlinks{display:flex;flex-direction:column;gap:2px}
.navlinks a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-weight:500}
.navlinks a:hover{background:var(--surface-2);color:var(--ink)}
.navlinks a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.navlinks svg{width:16px;height:16px;flex:none}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:12px}
.conn{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--good)}
.dot.live{background:var(--info);box-shadow:0 0 0 0 var(--info);animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--info) 60%,transparent)}70%{box-shadow:0 0 0 6px transparent}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion:reduce){.dot.live{animation:none}*{transition:none!important}}
main{padding-block:28px 64px;padding-inline:32px;min-width:0;max-width:1240px;width:100%}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:env(safe-area-inset-top,0px);height:auto;flex-direction:row;align-items:center;padding:10px 16px;gap:10px;z-index:20;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}
  .brand small,.rail-foot{display:none}
  .navlinks{flex-direction:row}
  .navlinks a span{display:none}
  .navlinks a{padding:8px}
  main{padding-inline:16px;padding-block:20px 48px}
}

/* generic */
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;min-width:0}
.card.flush{padding:0;overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
@media (max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--surface-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;border:1px solid transparent}
.st-running{background:var(--info-soft);color:var(--info)}
.st-completed{background:var(--surface-2);color:var(--ink-2)}
.st-terminated{background:var(--bad-soft);color:var(--bad)}
.st-scheduled{background:var(--flat-soft);color:var(--flat)}
.st-draft{background:transparent;color:var(--muted);border-color:var(--line)}
.v-success{background:var(--good-soft);color:var(--good)}
.v-failure{background:var(--bad-soft);color:var(--bad)}
.v-flat{background:var(--flat-soft);color:var(--flat)}
.v-pending{background:transparent;color:var(--muted);border-color:var(--line)}
.v-trend{background:var(--info-soft);color:var(--info)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:6px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2)}
.chip button{border:0;background:none;padding:0;cursor:pointer;color:var(--muted);line-height:1}
.tag-src{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--muted)}
.tag-src.adobe{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.tag-src.custom{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 35%,var(--line))}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:13px;min-width:0}
label.f .hint{font-weight:400;color:var(--muted);font-size:12px}
input[type=text],input[type=number],input[type=date],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 50%,transparent);border-color:var(--accent)}
.err{color:var(--bad);font-size:12px;font-weight:500}
.toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-weight:500}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;cursor:pointer;color:var(--ink-2);font-weight:500;font-size:13px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.sel td{background:var(--accent-soft)}
.r{text-align:right}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--f-display);font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.kpi span{font-size:12.5px;color:var(--muted)}
.mix{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-top:8px}
.mix i{display:block;height:100%}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters input[type=text]{width:220px}
.filters select{width:auto}
.statusbar{display:flex;gap:6px;flex-wrap:wrap}
.statusbar button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2);font-weight:500}
.statusbar button.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.statusbar button b{font-weight:600;margin-left:4px;opacity:.7}
.exname{font-weight:600;color:var(--ink)}
.exname small{display:block;font-family:var(--f-mono);font-weight:400;color:var(--muted);font-size:11.5px}
.liftcell{font-family:var(--f-mono);font-size:12.5px}
.up{color:var(--good)}.down{color:var(--bad)}
.gantt{min-width:720px;padding:8px 16px 16px}
.g-axis{position:relative;height:24px;border-bottom:1px solid var(--line);margin-left:220px}
.g-axis span{position:absolute;font-size:11px;color:var(--muted);transform:translateX(-50%);top:4px;white-space:nowrap}
.g-row{display:grid;grid-template-columns:220px 1fr;align-items:center;min-height:34px;border-bottom:1px dashed var(--line);cursor:pointer}
.g-row:hover{background:var(--surface-2)}
.g-row .lbl{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:12px}
.g-track{position:relative;height:34px}
.g-bar{position:absolute;top:9px;height:16px;border-radius:4px;font-size:10.5px;padding:0 6px;line-height:16px;white-space:nowrap;overflow:hidden;font-weight:600}
.g-today{position:absolute;top:0;bottom:0;width:0;border-left:2px solid var(--pin);z-index:2}
.g-today b{position:absolute;top:-20px;left:-18px;font-size:10px;color:var(--pin)}

/* detail */
.crumb{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-weight:500;margin-bottom:12px}
.crumb:hover{color:var(--ink)}
.dhead{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;align-items:flex-start}
.dhead .meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:13px;margin-top:8px;align-items:center}
.hyp{margin-top:12px;max-width:72ch;color:var(--ink-2)}
.hyp b{color:var(--ink)}
.prog{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:900px){.prog{grid-template-columns:repeat(2,minmax(0,1fr))}}
.prog .k{font-size:12px;color:var(--muted)}
.prog .v{font-family:var(--f-display);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.verdict{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;border-radius:12px;padding:22px;border:1px solid var(--line);background:var(--surface)}
@media (max-width:760px){.verdict{grid-template-columns:1fr}}
.verdict .big{display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line);padding-right:20px}
@media (max-width:760px){.verdict .big{border-right:0;padding-right:0;border-bottom:1px solid var(--line);padding-bottom:16px}}
.verdict .word{font-family:var(--f-display);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.verdict .word svg{width:30px;height:30px}
.w-success{color:var(--good)}.w-failure{color:var(--bad)}.w-flat{color:var(--flat)}.w-trend{color:var(--info)}.w-pending{color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 20px;margin-top:14px}
@media (max-width:600px){.checks{grid-template-columns:1fr}}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.check svg{width:16px;height:16px;flex:none;margin-top:2px}
.summary p+p{margin-top:8px}
.summary{max-width:78ch}
.forest svg{display:block;width:100%;height:22px}
.sigtag{font-size:11px;font-weight:600;padding:1px 6px;border-radius:4px}
.role{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%}
.tip{position:absolute;pointer-events:none;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;line-height:1.45;white-space:nowrap;z-index:5;box-shadow:var(--shadow)}
.tip b{font-weight:600}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.legend i.band{height:10px;opacity:.25;border-radius:2px}
.screens{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
@media (max-width:760px){.screens{grid-template-columns:1fr}}
.shotcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.shotcol h3{display:flex;align-items:center;gap:8px}
.shotwrap{display:flex;justify-content:center;background:var(--surface-2);border-radius:12px;padding:20px 12px}
.shot{position:relative;width:260px;max-width:100%}
.shot.adding{cursor:crosshair}
.shot img.up{display:block;width:100%;border-radius:18px;border:1px solid var(--line)}
.pinm{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;background:var(--pin);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;border:2px solid var(--surface);box-shadow:0 2px 6px rgba(0,0,0,.25);z-index:3;cursor:default}
.pinm.pending{background:var(--ink);color:var(--surface)}
.notes{display:flex;flex-direction:column;gap:8px;padding:0;margin:0;list-style:none}
.notes li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:10px;align-items:start;font-size:13px}
.notes li .n{width:22px;height:22px;border-radius:50%;background:var(--pin);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center}
.notes li .who{font-size:11.5px;color:var(--muted)}
/* mock phone */
.phone{border:6px solid #d5dce3;border-radius:26px;background:var(--surface);overflow:hidden;font-size:11px;line-height:1.35;color:var(--ink);user-select:none}
.scr{min-height:430px;display:flex;flex-direction:column;gap:8px;padding:10px 12px 14px}
.scr .sb{display:flex;justify-content:space-between;font-size:9px;color:var(--muted);font-weight:600}
.scr .tb{font-family:var(--f-display);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center}
.scr .ph{background:var(--surface-2);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:10px;text-align:center;padding:6px}
.scr .li{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.scr .mb{border-radius:8px;padding:9px;text-align:center;font-weight:700;font-size:11.5px}
.scr .mb.p{background:var(--accent);color:var(--accent-ink)}
.scr .mb.s{background:var(--surface-2);color:var(--ink)}
.scr .in{border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--muted)}
.scr .sm{font-size:9.5px;color:var(--muted)}
.scr .mc{border:1px solid var(--line);border-radius:8px;padding:8px}
.scr .mchips{display:flex;gap:4px;flex-wrap:wrap}
.scr .mchips span{background:var(--surface-2);padding:3px 7px;border-radius:999px;font-size:9.5px;font-weight:600}
.scr .chg{outline:2px dashed var(--pin);outline-offset:3px;border-radius:8px}
.scr.dark{background:#11161c;color:#e6ebf0}
.hl-off .scr .chg{outline:none}

/* wizard */
.wiz{display:grid;grid-template-columns:220px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.wiz{grid-template-columns:1fr}}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;position:sticky;top:20px}
@media (max-width:860px){.steps{flex-direction:row;overflow-x:auto;position:static}}
.steps button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:8px;cursor:pointer;text-align:left;color:var(--ink-2);font-weight:500;white-space:nowrap}
.steps button .sn{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:11px;font-weight:700;flex:none;background:var(--surface)}
.steps button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.steps button.on .sn{border-color:var(--accent);color:var(--accent)}
.steps button.done .sn{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid .full{grid-column:1/-1}
@media (max-width:640px){.fgrid{grid-template-columns:1fr}}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;background:var(--surface);font-weight:500}
.choice label:has(input:checked){border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.choice input{accent-color:var(--accent)}
.calc{background:var(--surface-2);border-radius:10px;padding:14px 16px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.calc{grid-template-columns:1fr}}
.calc .k{font-size:12px;color:var(--muted)}
.calc .v{font-family:var(--f-display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.note{display:flex;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;align-items:flex-start}
.note svg{width:16px;height:16px;flex:none;margin-top:2px}
.note.warn{background:var(--flat-soft);color:var(--flat)}
.note.ok{background:var(--good-soft);color:var(--good)}
.note.info{background:var(--info-soft);color:var(--info)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.vrow{display:grid;grid-template-columns:120px minmax(0,1fr) 90px 32px;gap:10px;align-items:center}
@media (max-width:640px){.vrow{grid-template-columns:1fr 80px 32px}.vrow .vd{grid-column:1/-1;order:5}}
.ms-wrap{position:relative}
.pop{position:absolute;z-index:30;top:calc(100% + 6px);left:0;width:min(440px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;max-height:440px}
.pop .ph{padding:10px;border-bottom:1px solid var(--line)}
.pop .pb{overflow-y:auto;padding:6px 6px 10px}
.pop .grp{padding:8px 8px 2px;display:flex;justify-content:space-between;align-items:center}
.pop .opt{display:grid;grid-template-columns:18px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;cursor:pointer}
.pop .opt:hover{background:var(--surface-2)}
.pop .opt input{accent-color:var(--accent)}
.pop .opt small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop .pf{padding:10px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.selm{display:grid;grid-template-columns:minmax(0,1fr) 150px 32px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.selm:last-child{border-bottom:0}
.packs{display:flex;gap:8px;flex-wrap:wrap}
.tokens{display:flex;gap:6px;flex-wrap:wrap}
.tokens button{font-family:var(--f-mono);font-size:11.5px;border:1px solid var(--line);background:var(--surface-2);border-radius:6px;padding:3px 7px;cursor:pointer}
.tokens button.op{min-width:28px}
.review dl{display:grid;grid-template-columns:180px minmax(0,1fr);gap:8px 16px;margin:0}
.review dt{color:var(--muted)}
.review dd{margin:0}
@media (max-width:640px){.review dl{grid-template-columns:1fr}.review dt{margin-top:6px}}
.upl{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--muted);font-size:12.5px;cursor:pointer;display:block}
.upl:hover{border-color:var(--accent);color:var(--accent)}
.upl input{display:none}

/* modal & toast */
.modal-bg{position:fixed;inset:0;background:rgba(10,14,18,.5);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:14px;width:min(620px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:22px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal pre{white-space:pre-wrap;background:var(--surface-2);padding:12px;border-radius:8px;font-family:var(--f-mono);font-size:12px;max-height:300px;overflow:auto;margin:0}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#2b3542;color:#fff;padding:10px 16px;border-radius:10px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:calc(100vw - 32px)}
.spinner{width:18px;height:18px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;display:inline-block}
@keyframes spin{to{transform:rotate(360deg)}}
.aa-logo{width:28px;height:28px;border-radius:6px;background:#e1251b;color:#fff;display:grid;place-items:center;font-weight:800;font-family:var(--f-display);font-size:13px;flex:none}
.comment{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px}
.av{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;border-left:2px solid var(--line);padding-left:14px}
.log li{font-size:12.5px;position:relative}
.log li:before{content:"";position:absolute;left:-19px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--surface);border:2px solid var(--muted)}
.feat{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.feat .card{padding:16px;display:flex;flex-direction:column;gap:6px}
.feat .where{font-size:12px;color:var(--accent);font-weight:600;text-decoration:none}
.feat .where:hover{text-decoration:underline}
.feat .seen{font-size:11.5px;color:var(--muted)}

function wireShots(e, v) {
  const box = $('#screens');
  box.onclick = ev => {
    const add = ev.target.closest('[data-add]'); if (add) { det.adding = det.adding === add.dataset.add ? null : add.dataset.add; det.pending = null; rerenderShots(e, v); return; }
    const del = ev.target.closest('[data-del]'); if (del) { const [s, i] = del.dataset.del.split(':'); e.notes[s].splice(+i, 1); save(); rerenderShots(e, v); return; }
    if (ev.target.closest('[data-cancel]')) { det.pending = null; rerenderShots(e, v); return; }
    const shot = ev.target.closest('.shot.adding');
    if (shot) { const b = shot.getBoundingClientRect(); det.pending = { side: shot.dataset.side, x: +((ev.clientX - b.left) / b.width * 100).toFixed(1), y: +((ev.clientY - b.top) / b.height * 100).toFixed(1) }; det.adding = null; rerenderShots(e, v); setTimeout(() => $('#pinText')?.focus(), 0); }

function validateFormula(f) {
  if (!f) return 'Write a formula, for example add_to_cart / unique_users.';
  if (/[^a-z0-9_\s()+\-*/.\[\]:]/i.test(f)) return 'Only events, numbers, + − × / and brackets are allowed.';

  if (/[+\-*/]\s*$/.test(f) || /^\s*[+*/]/.test(f)) return 'The formula ends or starts with an operator.';
  return '';
}
